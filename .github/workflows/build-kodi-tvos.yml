name: Build Kodi tvOS (GUI sound fix)

on:
  workflow_dispatch:
    inputs:
      xbmc_ref:
        description: "ビルドするxbmc/xbmcのブランチ・タグ (masterまたは例: 21.3-Omega)"
        required: false
        default: "master"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout this repo (workflow + patch script)
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          python3 --version
          java -version || true

      - name: Clone Kodi source
        run: |
          git clone --branch "${{ github.event.inputs.xbmc_ref || 'master' }}" --depth 1 \
            https://github.com/xbmc/xbmc "$HOME/kodi"
          cd "$HOME/kodi" && git rev-parse HEAD

      - name: Apply GUI sound fix to KeyHandler.cpp
        run: python3 scripts/patch_keyhandler.py "$HOME/kodi"

      - name: Bump libffi to a version that supports modern Clang
        run: |
          cd "$HOME/kodi/tools/depends/target/libffi"
          echo "--- before ---"; cat LIBFFI-VERSION
          sed -i '' 's/^VERSION=.*/VERSION=3.4.6/' LIBFFI-VERSION
          sed -i '' '/^SHA512=/d;/^SHA256=/d' LIBFFI-VERSION
          echo "--- after ---"; cat LIBFFI-VERSION

      - name: Cache Kodi dependencies
        uses: actions/cache@v4
        with:
          path: |
            /Users/Shared/xbmc-depends
            ~/kodi/tools/depends
          key: kodi-tvos-depends-v14-${{ runner.os }}-${{ github.event.inputs.xbmc_ref || 'master' }}

      - name: Configure & build dependencies (long-running)
        run: |
          cd "$HOME/kodi/tools/depends"
          ./bootstrap
          CFLAGS="-Wno-error" CXXFLAGS="-Wno-error" \
            ./configure --host=aarch64-apple-darwin --with-platform=tvos

          # --- native zlib ---
          make -C native/zlib || true
          find native/zlib -name "zutil.h" 2>/dev/null | while read -r f; do
            sed -i '' '/fdopen(fd,mode) NULL/d' "$f"
          done
          make -C native/zlib

          # --- native libpng ---
          make -C native/libpng || true
          find native/libpng -name "pngpriv.h" 2>/dev/null | while read -r f; do
            sed -i '' 's/ || defined(TARGET_OS_MAC)//' "$f"
          done

          # --- target側は依存順序があるので本体makeに任せる ---
          make -j"$(getconf _NPROCESSORS_ONLN)" || true

          find target -name "zutil.h" 2>/dev/null | while read -r f; do
            echo "patching target zutil.h: $f"
            sed -i '' '/fdopen(fd,mode) NULL/d' "$f"
          done
          find target -name "pngpriv.h" 2>/dev/null | while read -r f; do
            echo "patching target pngpriv.h: $f"
            sed -i '' 's/ || defined(TARGET_OS_MAC)//' "$f"
          done

          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Show config.log on failure (diagnostics)
        if: failure()
        run: |
          find "$HOME/kodi/tools/depends" -name "config.log" | while read -r f; do
            echo "===== $f ====="
            tail -100 "$f"
            echo
          done

      - name: Generate Xcode project
        run: |
          cd "$HOME/kodi"
          mkdir -p "$HOME/kodi-build"
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$HOME/kodi-build"

      - name: Build Kodi (Release, unsigned)
        run: |
          cd "$HOME/kodi-build"
          xcodebuild -config "Release" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          cd "$HOME/kodi-build"
          xcodebuild -target ipa CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Collect IPA for upload
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          find "$HOME/kodi-build/tools/darwin/packaging/darwin_embedded" -name "*.ipa" \
            -exec cp {} "${{ github.workspace }}/dist/" \;
          ls -la "${{ github.workspace }}/dist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodi-tvos-guisoundfix-ipa
          path: dist/*.ipa
          retention-days: 14
