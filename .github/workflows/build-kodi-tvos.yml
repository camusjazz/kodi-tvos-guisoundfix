name: Build Kodi tvOS (GUI sound fix)

# 手動実行のみ。Actionsタブの "Run workflow" ボタンから起動する。
# 誤ってpushのたびに走って無料枠を消費しないよう、on: push は付けていない。
on:
  workflow_dispatch:
    inputs:
      xbmc_ref:
        description: "ビルドするxbmc/xbmcのブランチ・タグ (masterまたは例: 21.2-Omega)"
        required: false
        default: "master"

jobs:
  build:
    # まずはこのランナーで試す。ビルドが通らない場合はmacos-14 / macos-13も試す価値あり
    # (公式ドキュメントはXcode 12.4/Catalina, 13.x/Montereyでのみテスト済みと明記している)
    runs-on: macos-15
    timeout-minutes: 300  # 依存関係のフルビルドは非常に時間がかかるため長めに確保しつつ上限を設定

    steps:
      - name: Checkout this repo (workflow + patch script)
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          python3 --version
          java -version || true

      - name: Clone Kodi source
        run: |
          git clone --branch "${{ github.event.inputs.xbmc_ref || 'master' }}" --depth 1 \
            https://github.com/xbmc/xbmc "$HOME/kodi"
          cd "$HOME/kodi" && git rev-parse HEAD

      - name: Apply GUI sound fix to KeyHandler.cpp
        run: python3 scripts/patch_keyhandler.py "$HOME/kodi"

      # 依存関係のビルドが一番時間がかかる部分。同じ入力ならキャッシュを使い回す。
      # 依存関係を作り直したい時は下のキーの "v1" を "v2" などに変えて再実行する。
      - name: Cache Kodi dependencies
        uses: actions/cache@v4
        with:
          path: |
            /Users/Shared/xbmc-depends
            ~/kodi/tools/depends
          key: kodi-tvos-depends-v1-${{ runner.os }}-${{ github.event.inputs.xbmc_ref || 'master' }}

       - name: Configure & build dependencies (long-running)
        env:
          CFLAGS: "-Wno-error=deprecated-non-prototype -Wno-error=implicit-function-declaration"
          CXXFLAGS: "-Wno-error=deprecated-non-prototype -Wno-error=implicit-function-declaration"
        run: |
          cd "$HOME/kodi/tools/depends"
          ./bootstrap
          ./configure --host=aarch64-apple-darwin --with-platform=tvos
          make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Generate Xcode project
        run: |
          cd "$HOME/kodi"
          mkdir -p "$HOME/kodi-build"
          make -C tools/depends/target/cmakebuildsys BUILD_DIR="$HOME/kodi-build"

      - name: Build Kodi (Release, unsigned)
        run: |
          cd "$HOME/kodi-build"
          xcodebuild -config "Release" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          cd "$HOME/kodi-build"
          xcodebuild -target ipa CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Collect IPA for upload
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          find "$HOME/kodi-build/tools/darwin/packaging/darwin_embedded" -name "*.ipa" \
            -exec cp {} "${{ github.workspace }}/dist/" \;
          ls -la "${{ github.workspace }}/dist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodi-tvos-guisoundfix-ipa
          path: dist/*.ipa
          retention-days: 14
